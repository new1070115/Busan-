const BUSAN_LAT=35.1796;const BUSAN_LON=129.0756;let weatherCache=null;let weatherCacheTime=0;const WEATHER_CACHE_MS=30*60*1000;
async function fetchWeather(force=false){if(!force&&weatherCache&&Date.now()-weatherCacheTime<WEATHER_CACHE_MS)return weatherCache;try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${BUSAN_LAT}&longitude=${BUSAN_LON}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&models=kma_seamless&forecast_days=14`;const res=await fetch(url);const data=await res.json();weatherCache=data;weatherCacheTime=Date.now();return data}catch(e){return null}}
function weatherDesc(code){const map={0:['☀️','晴天'],1:['🌤️','大致晴朗'],2:['⛅','多雲'],3:['☁️','陰天'],45:['🌫️','霧'],48:['🌫️','霧'],51:['🌦️','毛毛雨'],53:['🌦️','毛毛雨'],55:['🌦️','毛毛雨'],61:['🌧️','雨'],63:['🌧️','雨'],65:['🌧️','大雨'],71:['❄️','雪'],73:['❄️','雪'],75:['❄️','大雪'],80:['🌧️','陣雨'],81:['🌧️','陣雨'],82:['🌧️','強陣雨'],95:['⛈️','雷雨']};return map[code]||['❓','未知']}
function toApiDate(dateStr){const year=new Date().getFullYear();const[m,d]=dateStr.split('/');return`${year}-${m}-${d}`}
async function renderWeather(date){const el=document.getElementById('weatherContent');if(!el)return;const data=await fetchWeather();if(!data||!data.daily){el.innerHTML='<div class="weather-loading">天氣資訊無法取得，請稍後再試。</div>';return}const idx=data.daily.time.indexOf(toApiDate(date));if(idx===-1){el.innerHTML='<div class="weather-loading">這天沒有天氣資料。</div>';return}const code=data.daily.weather_code[idx];const[icon,desc]=weatherDesc(code);const tMax=data.daily.temperature_2m_max[idx];const tMin=data.daily.temperature_2m_min[idx];const rain=data.daily.precipitation_probability_max[idx];el.innerHTML=`<div class="weather-main"><div class="weather-icon">${icon}</div><div><div class="weather-temp">${tMin}° ~ ${tMax}°</div><div class="weather-detail">${desc}</div></div></div><div class="weather-rain"><span>🌧️ 降雨機率</span><span>${rain}%</span></div>`}
function refreshWeather(){const el=document.getElementById('weatherContent');if(el)el.innerHTML='<div class="weather-loading">天氣更新中...</div>';fetchWeather(true).then(()=>renderWeather(current.date))}
let exchangeRate=null;async function getRate(){if(exchangeRate)return exchangeRate;try{const res=await fetch('https://open.er-api.com/v6/latest/TWD');const data=await res.json();if(data&&data.rates&&data.rates.KRW){exchangeRate=data.rates.KRW}}catch(e){}if(!exchangeRate)exchangeRate=42;return exchangeRate}
function renderTools(el){el.innerHTML=`<div class="card"><h3>💱 即時匯率</h3><p class="hint">台幣 ⇄ 韓元，輸入金額即可換算</p><div class="currency-row"><input class="currency-input" id="twdInput" type="number" placeholder="台幣" oninput="convertFromTWD(this.value)"><span class="currency-unit">TWD</span></div><div class="currency-row"><input class="currency-input" id="krwInput" type="number" placeholder="韓元" oninput="convertFromKRW(this.value)"><span class="currency-unit">KRW</span></div><div class="currency-rate" id="rateInfo">匯率載入中...</div></div><div class="card"><h3>🗣️ 韓文日常用語</h3><p class="hint">點播放，可直接唸給店員聽</p><div id="phraseList"></div></div>`;const phrases=[['你好','안녕하세요'],['謝謝','감사합니다'],['請給我這個','이거 주세요'],['多少錢？','얼마예요?'],['太貴了','너무 비싸요'],['可以算便宜一點嗎？','깎아 주세요'],['我要點餐','주문할게요'],['請給我水','물 주세요'],['廁所在哪裡？','화장실 어디예요?'],['這個好吃','맛있어요'],['請結帳','계산해 주세요'],['我要外帶','포장이요'],['請幫我拍照','사진 찍어 주세요'],['這個不要辣','안 맵게 해 주세요'],['請給我菜單','메뉴판 주세요']];document.getElementById('phraseList').innerHTML=phrases.map(([zh,ko])=>`<div class="phrase-item"><div class="phrase-text"><div class="phrase-zh">${zh}</div><div class="phrase-ko">${ko}</div></div><button class="play-btn" onclick="speakKorean('${ko.replace(/'/g,"\\'")}')">🔊 播放</button></div>`).join('');getRate().then(rate=>{document.getElementById('rateInfo').textContent=`1 台幣 = ${rate.toFixed(2)} 韓元`})}
function convertFromTWD(val){if(val===''){document.getElementById('krwInput').value='';return}getRate().then(rate=>{document.getElementById('krwInput').value=Math.round(parseFloat(val)*rate)})}function convertFromKRW(val){if(val===''){document.getElementById('twdInput').value='';return}getRate().then(rate=>{document.getElementById('twdInput').value=Math.round(parseFloat(val)/rate)})}
function speakKorean(text){if(!('speechSynthesis' in window)){alert('此裝置不支援語音播放');return}const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=0.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function loadData(){const raw=localStorage.getItem('busanTripApp_v1');if(raw){try{const d=JSON.parse(raw);const merged=Object.assign({},defaultData,d);merged.flights=defaultData.flights;merged.tripTitle=defaultData.tripTitle;return merged}catch(e){}}return JSON.parse(JSON.stringify(defaultData))}function saveData(){localStorage.setItem('busanTripApp_v1',JSON.stringify(appData));if(firebaseReady&&!suppressFirebase){try{firebase.database().ref('appData').set(appData)}catch(e){}}}
function formatTime(iso){if(!iso)return'';const d=new Date(iso);const p=n=>(n<10?'0':'')+n;return`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`}function recycleDisplayName(item){if(item&&item.name)return item.name;if(item&&item.from&&item.to)return item.from+' → '+item.to;if(item&&item.text)return item.text.length>30?item.text.slice(0,30)+'…':item.text;return'未命名項目'}
function render(){const content=$('#content');const title=$('#headerTitle');const back=$('#backBtn');title.textContent=pageTitles[current.page]||'行程';back.style.display=(current.page==='stats'||current.page==='notes'||current.page==='recycle')?'flex':'none';if(current.page==='today')renderToday(content);else if(current.page==='itinerary')renderItinerary(content);else if(current.page==='food')renderFood(content);else if(current.page==='shopping')renderShopping(content);else if(current.page==='medical')renderMedical(content);else if(current.page==='stats')renderStats(content);else if(current.page==='notes')renderNotes(content);else if(current.page==='tools')renderTools(content);else if(current.page==='recycle')renderRecycle(content);document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===current.page));window.scrollTo(0,0)}
function nav(page){current.page=page;if(page==='today')current.sub='daily';if(page==='itinerary'&&!['daily','attractions','transport'].includes(current.sub))current.sub='daily';render()}function setDate(d){current.date=d;render()}function goBack(){if(current.page==='stats'||current.page==='notes'||current.page==='recycle'){current.page='today';render()}}
function openModal(title,body,onSave){document.querySelectorAll('.modal').forEach(m=>m.remove());const modal=document.createElement('div');modal.className='modal';let inner='';if(onSave){inner=`<form id="modalForm">${body}<div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="this.closest('.modal').remove()">取消</button><button type="submit" class="btn btn-primary">儲存</button></div></form>`}else{inner=`${body}<div class="modal-footer"><button type="button" class="btn btn-primary" onclick="this.closest('.modal').remove()">關閉</button></div>`}modal.innerHTML=`<div class="modal-card"><div class="modal-header"><h3>${title}</h3><button class="close-btn" onclick="this.closest('.modal').remove()">×</button></div>${inner}</div>`;document.body.appendChild(modal);if(onSave){const form=modal.querySelector('#modalForm');form.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form);onSave(fd);modal.remove()})}}
function renderToday(el){
    const date=current.date;
    const items=appData.itin.filter(i=>i.date===date).sort(sortItin);
    const conf=items.filter(i=>i.status==='confirmed').length;
    const pend=items.filter(i=>i.status==='pending').length;
    const total=appData.itin.length;
    const totalConf=appData.itin.filter(i=>i.status==='confirmed').length;
    const rate=total?Math.round(totalConf/total*100):0;
    const flightCard=(appData.flights&&appData.flights[0]&&appData.flights[0].fromCode==='TPE')?appData.flights:defaultData.flights;
    const tripInfo=(appData.tripTitle&&appData.tripTitle.title)?appData.tripTitle:defaultData.tripTitle;
    const outF=flightCard[0];
    const retF=flightCard[1];
    
    // 計算距離出發日期的倒數計時
    const now = new Date();
    const departDate = new Date(now.getFullYear(), 9, 18); // 10月18日出發 (月份0-11，所以9是10月)
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffDays = Math.round((departDate - today) / (1000*60*60*24));
    
    let countdownHtml = '';
    if(diffDays > 0) {
        countdownHtml = `<div style="background:linear-gradient(90deg, #F39C12, #E67E22); color:#fff; text-align:center; padding:10px; border-radius:14px; font-weight:800; font-size:15px; margin-bottom:14px; box-shadow:0 4px 12px rgba(243,156,18,0.3); letter-spacing:1px;">⏳ 距離出發還剩 ${diffDays} 天！準備行李囉！</div>`;
    } else if (diffDays === 0) {
        countdownHtml = `<div style="background:linear-gradient(90deg, #27AE60, #2ECC71); color:#fff; text-align:center; padding:10px; border-radius:14px; font-weight:800; font-size:15px; margin-bottom:14px; box-shadow:0 4px 12px rgba(39,174,96,0.3); letter-spacing:1px;">✈️ 就是今天！祝釜山旅途愉快！</div>`;
    }
    
    // 航班動態搜尋連結
    const outLink = `https://www.google.com/search?q=航班+${outF.flightNo}`;
    const retLink = `https://www.google.com/search?q=航班+${retF.flightNo}`;

    const flightHtml=`<div class="flight-card"><div class="flight-title">✈️ ${tripInfo.title}</div><div class="flight-airports"><div class="airport"><div class="code">${outF.fromCode}</div><div class="city">${outF.fromCity}</div></div><div class="flight-plane">✈️</div><div class="airport"><div class="code">${outF.toCode}</div><div class="city">${outF.toCity}</div></div></div><div class="flight-details"><div class="flight-detail"><span>去程</span><strong>${outF.date}</strong><a href="${outLink}" target="_blank" style="text-decoration:none;color:inherit;" title="點擊查詢航班動態"><em>${outF.flightNo} 🔍</em></a></div><div class="flight-detail"><span>回程</span><strong>${retF.date}</strong><a href="${retLink}" target="_blank" style="text-decoration:none;color:inherit;" title="點擊查詢航班動態"><em>${retF.flightNo} 🔍</em></a></div><div class="flight-detail"><span>天數</span><strong>${tripInfo.days}</strong></div></div></div>`;
    
    const weatherHtml=`<div class="weather-card"><div class="weather-header"><div class="weather-title">🌤️ 天氣預報</div><button class="weather-refresh" onclick="refreshWeather()">↻</button></div><div id="weatherContent" class="weather-loading">天氣載入中...</div></div>`;
    const list=items.length?items.map(itineraryItemHtml).join(''):'<p class="empty-text">這天還沒有行程，點下方按鈕新增。</p>';
    
    el.innerHTML=`${countdownHtml}${flightHtml}${weatherHtml}<div class="date-pills">${tripDates.map(d=>`<button class="date-pill ${d===date?'active':''}" onclick="setDate('${d}')">${d}</button>`).join('')}</div><div class="card summary-card"><div class="summary-item"><span class="num">${conf}</span><span>已安排</span></div><div class="summary-item"><span class="num">${pend}</span><span>待安排</span></div><div class="summary-item"><span class="num">${rate}%</span><span>整體安排率</span></div></div><div class="card"><h3>${date} 行程</h3><div class="list">${list}</div></div><button class="add-button" onclick="openItineraryForm('${date}')">＋ 新增當日行程</button><div class="quick-cards"><div class="quick-card" onclick="nav('stats')"><span class="quick-icon">📊</span><span>統計總覽</span></div><div class="quick-card" onclick="nav('notes')"><span class="quick-icon">📝</span><span>隨手筆記</span></div><div class="quick-card" style="grid-column:span 2;" onclick="nav('recycle')"><span class="quick-icon">🗑️</span><span>資源回收桶（${appData.recycleBin.length}）</span></div></div>`;
    
    renderWeather(date);

function sortItin(a,b){if(a.status!==b.status)return a.status==='confirmed'?-1:1;return(a.time||'').localeCompare(b.time||'')}function itineraryItemHtml(item){const icons={景點:'📍',餐廳:'🍽️',購物:'🛍️',醫美:'💆',其他:'📌'};const icon=icons[item.type]||'📌';const badge=item.status==='confirmed'?'badge-confirmed':'badge-pending';const label=item.status==='confirmed'?'已確認':'待安排';return`<div class="item"><div class="item-main" onclick="openItineraryForm('${esc(item.date)}','${item.id}')"><div class="item-title">${icon} ${esc(item.name)}</div><div class="item-sub">${item.time?esc(item.time)+' · ':''}${esc(item.type)}${item.openingHours?' · '+esc(item.openingHours):''}${item.transportation?' · '+esc(item.transportation):''}</div>${item.address?`<div class="item-sub">📍 ${esc(item.address)}</div>`:''}${item.cost!==''&&item.cost!=null?`<div class="item-sub">💰 ${esc(item.cost)}</div>`:''}${item.note?`<div class="item-sub">📝 ${esc(item.note)}</div>`:''}</div><div class="item-right"><span class="badge ${badge}">${label}</span><button class="icon-btn delete-btn" onclick="deleteItinerary('${item.id}')">🗑️</button></div></div>`}

function deleteFood(id){if(!confirm('確定刪除這間餐廳嗎？'))return;const item=appData.foods.find(x=>x.id===id);if(item){appData.recycleBin.push({id:item.id,type:'美食',item:item,deletedAt:new Date().toISOString()})}appData.foods=appData.foods.filter(x=>x.id!==id);saveData();render()}
function renderShopping(el){const chips=[['all','全部'],['unpurchased','未購買'],['purchased','已購買']].map(([v,l])=>`<button class="sub-tab ${current.shoppingFilter===v?'active':''}" onclick="current.shoppingFilter='${v}';render()">${l}</button>`).join('');const list=appData.shopping.filter(s=>current.shoppingFilter==='all'||(current.shoppingFilter==='purchased'?s.purchased:!s.purchased)).map(shoppingCardHtml).join('');el.innerHTML=`<div class="card"><div class="sub-tabs">${chips}</div></div><div class="card"><h3>🛍️ 購物清單</h3><div class="list">${list||'<p class="empty-text">沒有符合的購物項目。</p>'}</div></div><button class="add-button" onclick="openShoppingForm()">＋ 新增購物項目</button>`}function shoppingCardHtml(s){const badge=s.purchased?'badge-purchased':'badge-unpurchased';const label=s.purchased?'已購買':'未購買';return`<div class="item"><div class="item-main" onclick="openShoppingForm('${s.id}')"><div class="item-title">🛍️ ${esc(s.name)}</div><div class="item-sub">${s.shop?esc(s.shop):''}${s.budget?' · 預算 '+esc(s.budget):''}</div>${s.purchased&&s.actualPrice!==''&&s.actualPrice!=null?`<div class="item-sub">實際 ${esc(s.actualPrice)}</div>`:''}${s.taxRefundNote?`<div class="item-sub">🧾 ${esc(s.taxRefundNote)}</div>`:''}</div><div class="item-right"><span class="badge ${badge}">${label}</span><button class="icon-btn delete-btn" onclick="deleteShopping('${s.id}')">🗑️</button></div></div>`}function openShoppingForm(id){const s=id?appData.shopping.find(x=>x.id===id):null;const body=`<label class="form-label">商品名稱</label><input name="name" class="form-control" value="${esc(s?.name||'')}" required><label class="form-label">預計購買地點／商店</label><input name="shop" class="form-control" value="${esc(s?.shop||'')}"><label class="form-label">預算金額</label><input name="budget" class="form-control" type="number" value="${esc(s?.budget??'')}" placeholder="數字即可"><label class="form-label" style="display:block;margin-top:12px;"><input type="checkbox" name="purchased" ${s?.purchased?'checked':''} style="width:18px;height:18px;vertical-align:middle;"> 已購買</label><label class="form-label">實際購買價格</label><input name="actualPrice" class="form-control" type="number" value="${esc(s?.actualPrice??'')}" placeholder="已購買才需填"><label class="form-label">退稅備註</label><textarea name="taxRefundNote" class="form-control" placeholder="例如：保留退稅單">${esc(s?.taxRefundNote||'')}</textarea>`;openModal(s?'編輯購物項目':'新增購物項目',body,fd=>{const purchased=fd.get('purchased')==='on';const obj={id:s?s.id:uid(),name:fd.get('name').trim(),shop:fd.get('shop').trim(),budget:fd.get('budget')?Number(fd.get('budget')):'',purchased:purchased,actualPrice:fd.get('actualPrice')?Number(fd.get('actualPrice')):'',taxRefundNote:fd.get('taxRefundNote').trim()};if(s){const i=appData.shopping.findIndex(x=>x.id===s.id);appData.shopping[i]=obj}else appData.shopping.push(obj);saveData();render()})}
function deleteShopping(id){if(!confirm('確定刪除這個購物項目嗎？'))return;const item=appData.shopping.find(x=>x.id===id);if(item){appData.recycleBin.push({id:item.id,type:'購物',item:item,deletedAt:new Date().toISOString()})}appData.shopping=appData.shopping.filter(x=>x.id!==id);saveData();render()}
function renderMedical(el){const list=appData.clinics.length?appData.clinics.map(clinicCardHtml).join(''):'<p class="empty-text">尚無診所資料。</p>';el.innerHTML=`<div class="card"><h3>💆 醫美診所與項目</h3><p class="hint">記錄候選診所、比價與預約資訊。</p></div><div class="list">${list}</div><button class="add-button" onclick="openClinicForm()">＋ 新增診所</button>`}function clinicCardHtml(c){const treats=(c.treatments||[]).map(t=>`<div class="item-sub">• ${esc(t.treatmentName)}${t.price?' — ₩'+esc(t.price):''}</div>`).join('');const appt=(c.appointmentDate||c.appointmentTime||c.appointmentTreatment)?`<div class="item-sub">📅 預約：${esc(c.appointmentDate||'')} ${esc(c.appointmentTime||'')} ${esc(c.appointmentTreatment||'')}</div>`:'';return`<div class="item"><div class="item-main" onclick="openClinicForm('${c.id}')"><div class="item-title">🏥 ${esc(c.name)}</div><div class="item-sub">${esc(c.address||'')}${c.phone?' · '+esc(c.phone):''}</div><div class="item-sub">${esc(c.openingHours||'')}</div>${treats}${appt}${c.appointmentNote?`<div class="item-sub">⚠️ ${esc(c.appointmentNote)}</div>`:''}</div><div class="item-right"><button class="icon-btn delete-btn" onclick="deleteClinic('${c.id}')">🗑️</button></div></div>`}function openClinicForm(id){const c=id?appData.clinics.find(x=>x.id===id):null;const treatments=(c&&c.treatments&&c.treatments.length)?c.treatments:[{treatmentName:'',price:''}];const treatHtml=treatments.map((t,i)=>`<div class="treat-row" style="display:flex;gap:6px;margin-bottom:8px;align-items:center;"><input class="form-control t-name" placeholder="項目名稱（例如：淨膚雷射）" value="${esc(t.treatmentName)}"><input class="form-control t-price" type="number" placeholder="₩ 價格" value="${esc(t.price??'')}" style="width:120px;"><button type="button" class="btn btn-danger" onclick="this.parentElement.remove()" style="padding:8px;">✕</button></div>`).join('');const body=`<label class="form-label">診所名稱</label><input name="name" class="form-control" value="${esc(c?.name||'')}" required><label class="form-label">地址</label><input name="address" class="form-control" value="${esc(c?.address||'')}"><label class="form-label">電話</label><input name="phone" class="form-control" value="${esc(c?.phone||'')}"><label class="form-label">營業時間</label><input name="openingHours" class="form-control" value="${esc(c?.openingHours||'')}"><label class="form-label">皮膚保養項目與價格</label><div id="treatList">${treatHtml}</div><button type="button" class="btn btn-secondary" onclick="addTreatRow()">＋ 新增項目</button><h4 style="margin:16px 0 4px;color:#0A3D62;">預約資訊</h4><label class="form-label">預約日期</label><input name="apptDate" class="form-control" value="${esc(c?.appointmentDate||'')}" placeholder="例如：10/20"><label class="form-label">預約時間</label><input name="apptTime" class="form-control" value="${esc(c?.appointmentTime||'')}" placeholder="例如：14:00"><label class="form-label">預約項目</label><input name="apptTreatment" class="form-control" value="${esc(c?.appointmentTreatment||'')}"><label class="form-label">術前提醒</label><textarea name="apptNote" class="form-control" placeholder="例如：當天不要化妝">${esc(c?.appointmentNote||'')}</textarea>`;openModal(c?'編輯診所':'新增診所',body,fd=>{const rows=document.querySelectorAll('#treatList .treat-row');const treatments=Array.from(rows).map(r=>({treatmentName:r.querySelector('.t-name').value.trim(),price:r.querySelector('.t-price').value?Number(r.querySelector('.t-price').value):''})).filter(t=>t.treatmentName);const obj={id:c?c.id:uid(),name:fd.get('name').trim(),address:fd.get('address').trim(),phone:fd.get('phone').trim(),openingHours:fd.get('openingHours').trim(),treatments:treatments,appointmentDate:fd.get('apptDate').trim(),appointmentTime:fd.get('apptTime').trim(),appointmentTreatment:fd.get('apptTreatment').trim(),appointmentNote:fd.get('apptNote').trim()};if(c){const i=appData.clinics.findIndex(x=>x.id===c.id);appData.clinics[i]=obj}else appData.clinics.push(obj);saveData();render()})}
function deleteClinic(id){if(!confirm('確定刪除這間診所嗎？'))return;const item=appData.clinics.find(x=>x.id===id);if(item){appData.recycleBin.push({id:item.id,type:'醫美',item:item,deletedAt:new Date().toISOString()})}appData.clinics=appData.clinics.filter(x=>x.id!==id);saveData();render()}
function addTreatRow(){const list=$('#treatList');if(!list)return;const div=document.createElement('div');div.className='treat-row';div.style.cssText='display:flex;gap:6px;margin-bottom:8px;align-items:center;';div.innerHTML=`<input class="form-control t-name" placeholder="項目名稱"><input class="form-control t-price" type="number" placeholder="₩ 價格" style="width:120px;"><button type="button" class="btn btn-danger" onclick="this.parentElement.remove()" style="padding:8px;">✕</button>`;list.appendChild(div)}
function renderStats(el){const itin=appData.itin;const total=itin.length;const conf=itin.filter(i=>i.status==='confirmed').length;const rate=total?Math.round(conf/total*100):0;const dailyRows=tripDates.map(d=>{const items=itin.filter(i=>i.date===d);const counts={景點:0,餐廳:0,購物:0,醫美:0,其他:0};items.forEach(i=>{counts[i.type]=(counts[i.type]||0)+1});const p=items.filter(i=>i.status==='pending').length;return`<tr><td>${d}</td><td>${items.length}</td><td>${items.length-p}</td><td>${p}</td><td>${counts['景點']||0}</td><td>${counts['餐廳']||0}</td><td>${counts['購物']||0}</td><td>${counts['醫美']||0}</td><td>${counts['其他']||0}</td></tr>`}).join('');let medHtml='';const clinics=appData.clinics;if(!clinics.length){medHtml='<p class="empty-text">尚無醫美診所資料。</p>'}else{const groups={};clinics.forEach(c=>{(c.treatments||[]).forEach(t=>{const name=t.treatmentName.trim();if(!name)return;groups[name]=groups[name]||[];groups[name].push({clinic:c.name,price:t.price})})});const keys=Object.keys(groups);if(!keys.length){medHtml='<p class="empty-text">診所內尚無治療項目。</p>'}else{medHtml=keys.map(k=>{const prices=groups[k];const nums=prices.map(p=>typeof p.price==='number'?p.price:(p.price?Number(p.price):Infinity));const min=Math.min.apply(null,nums);const listHtml=prices.map(p=>{const val=typeof p.price==='number'?p.price:(p.price?Number(p.price):Infinity);return`<li>${esc(p.clinic)}：${p.price===''||p.price==null?'未填':'₩'+esc(p.price)}${val===min&&val!==Infinity?' ⭐最低':''}</li>`}).join('');return`<div style="margin-bottom:8px;"><strong>${esc(k)}</strong><ul style="margin-left:18px;font-size:13px;">${listHtml}</ul></div>`}).join('')}}const shop=appData.shopping;const budgetTotal=shop.reduce((s,i)=>s+(Number(i.budget)||0),0);const actualTotal=shop.filter(i=>i.purchased).reduce((s,i)=>s+(Number(i.actualPrice)||0),0);const purchasedCount=shop.filter(i=>i.purchased).length;const unpurchasedCount=shop.length-purchasedCount;const foods=appData.foods;const foodCounts={candidate:0,confirmed:0,eaten:0};foods.forEach(f=>{if(foodCounts[f.status]!==undefined)foodCounts[f.status]++});el.innerHTML=`<div class="card"><h3>📊 行程安排率</h3><div class="stat-big">${rate}%</div><div class="stat-sub">已確認 ${conf} 項／總計 ${total} 項</div></div><div class="card"><h3>📅 每日行程總覽</h3><table class="stat-table"><thead><tr><th>日期</th><th>總數</th><th>已確認</th><th>待安排</th><th>景點</th><th>餐廳</th><th>購物</th><th>醫美</th><th>其他</th></tr></thead><tbody>${dailyRows}</tbody></table></div><div class="card"><h3>💆 醫美比價</h3>${medHtml}</div><div class="card"><h3>🛍️ 購物預算／實際</h3><div class="stat-row"><span>預算合計</span><span>${budgetTotal}</span></div><div class="stat-row"><span>實際已花</span><span>${actualTotal}</span></div><div class="stat-row"><span>未購買／已購買</span><span>${unpurchasedCount} / ${purchasedCount}</span></div></div><div class="card"><h3>🍽️ 餐廳清單</h3><div class="stat-row"><span>候補</span><span>${foodCounts.candidate}</span></div><div class="stat-row"><span>已確認</span><span>${foodCounts.confirmed}</span></div><div class="stat-row"><span>吃過了</span><span>${foodCounts.eaten}</span></div></div>`}
function renderNotes(el){const notes=appData.notes.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));const list=notes.map(n=>`<div class="card note-card"><div class="note-date">📅 ${esc(n.date||'')}</div><div class="note-text">${esc(n.text||'')}</div>${n.imageData?`<img src="${n.imageData}" class="note-img" alt="照片">`:''}<div style="margin-top:10px;display:flex;gap:8px;"><button class="btn btn-secondary" onclick="openNoteForm('${n.id}')">編輯</button><button class="btn btn-danger" onclick="deleteNote('${n.id}')">刪除</button></div></div>`).join('');el.innerHTML=`<div class="card"><h3>📝 隨手筆記</h3><p class="hint">記下臨時資訊、行程異動、突發狀況。</p></div>${list||'<div class="card"><p class="empty-text">尚無筆記。</p></div>'}<button class="add-button" onclick="openNoteForm()">＋ 新增筆記</button>`}function openNoteForm(id){const n=id?appData.notes.find(x=>x.id===id):null;const existingImage=n?.imageData||'';const body=`<label class="form-label">日期</label><input name="date" class="form-control" value="${esc(n?.date||current.date)}" placeholder="例如：10/18"><label class="form-label">內容</label><textarea name="text" class="form-control" placeholder="寫下筆記...">${esc(n?.text||'')}</textarea><label class="form-label">照片（選填）</label><input type="file" id="noteImageInput" accept="image/*" style="display:none;" onchange="previewNoteImage(this)"><input type="hidden" id="noteImageData" name="imageData" value="${esc(existingImage)}"><div style="display:flex;gap:8px;margin-top:6px;"><button type="button" class="btn btn-secondary" onclick="document.getElementById('noteImageInput').click()">選擇照片</button><button type="button" class="btn btn-danger" onclick="clearNoteImage()">移除照片</button></div><div id="noteImagePreview" style="margin-top:8px;">${existingImage?`<img src="${existingImage}" class="note-img" alt="照片">`:''}</div>`;openModal(n?'編輯筆記':'新增筆記',body,fd=>{const obj={id:n?n.id:uid(),date:fd.get('date').trim(),text:fd.get('text').trim(),imageData:fd.get('imageData')||''};if(n){const i=appData.notes.findIndex(x=>x.id===n.id);appData.notes[i]=obj}else appData.notes.push(obj);saveData();render()})}function previewNoteImage(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{$('#noteImageData').value=ev.target.result;$('#noteImagePreview').innerHTML=`<img src="${ev.target.result}" class="note-img" alt="照片">`};reader.readAsDataURL(file)}function clearNoteImage(){$('#noteImageInput').value='';$('#noteImageData').value='';$('#noteImagePreview').innerHTML=''}function deleteNote(id){if(!confirm('確定刪除這則筆記嗎？'))return;const item=appData.notes.find(x=>x.id===id);if(item){appData.recycleBin.push({id:item.id,type:'筆記',item:item,deletedAt:new Date().toISOString()})}appData.notes=appData.notes.filter(x=>x.id!==id);saveData();render()}
function openBackupModal(){const body=`<p class="hint">資料已即時同步到 Firebase，仍可使用 JSON 做本機備份。</p><div style="display:flex;flex-direction:column;gap:10px;"><button type="button" class="btn btn-primary" onclick="exportData()">⬆️ 匯出備份（JSON）</button><button type="button" class="btn btn-secondary" onclick="importData()">⬇️ 匯入備份</button></div>`;openModal('資料備份',body,null)}function exportData(){const payload={app:'busan-trip-manager',version:1,exportedAt:new Date().toISOString(),data:appData};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='釜山旅遊管理備份.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}function importData(){$('#importFile').click()}document.getElementById('importFile').addEventListener('change',function(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const parsed=JSON.parse(ev.target.result);const data=parsed.data||parsed;if(!data||typeof data!=='object')throw new Error('bad');if(!confirm('匯入將覆蓋目前所有資料，確定繼續？'))return;appData=Object.assign({},defaultData,data);appData.flights=defaultData.flights;appData.tripTitle=defaultData.tripTitle;saveData();current.page='today';current.sub='daily';render();alert('匯入成功，並已同步到雲端！')}catch(err){alert('匯入失敗：請確認檔案格式')}};reader.readAsText(file);e.target.value=''});
function initFirebase(){if(typeof firebase==='undefined'){document.getElementById('syncStatus').textContent='❌';return}try{firebase.initializeApp(firebaseConfig);firebaseReady=true;const dbRef=firebase.database().ref('appData');dbRef.on('value',snap=>{const val=snap.val();if(val&&typeof val==='object'){suppressFirebase=true;appData=Object.assign({},defaultData,val);appData.flights=defaultData.flights;appData.tripTitle=defaultData.tripTitle;localStorage.setItem('busanTripApp_v1',JSON.stringify(appData));suppressFirebase=false;document.getElementById('syncStatus').textContent='🟢';render()}else{suppressFirebase=true;dbRef.set(appData).then(()=>{document.getElementById('syncStatus').textContent='🟢'}).catch(()=>{document.getElementById('syncStatus').textContent='🟡'});suppressFirebase=false}},err=>{document.getElementById('syncStatus').textContent='🟡'})}catch(e){console.error(e);document.getElementById('syncStatus').textContent='❌'}}
if(!localStorage.getItem('busanTripApp_v1')){localStorage.setItem('busanTripApp_v1',JSON.stringify(defaultData))}render();initFirebase();
</script>
</body>
